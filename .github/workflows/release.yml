name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Full CI suite (lint, tests, e2e, build) must pass on the tagged commit
  # before anything reaches PyPI — published versions are immutable.
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Check tag matches project version
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject.toml version $VERSION"
            exit 1
          fi

      - run: uv build

      - run: python3 scripts/verify_artifacts.py

      # --check-url makes re-runs idempotent: files already uploaded are
      # skipped instead of failing on PyPI's duplicate-filename rejection.
      - run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/
