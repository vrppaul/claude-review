name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Full CI suite (lint, tests, e2e, build) must pass on the tagged commit
  # before anything reaches PyPI — published versions are immutable.
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8

      - name: Check tag matches project version
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject.toml version $VERSION"
            exit 1
          fi

      - run: uv build

      - run: python3 scripts/verify_artifacts.py

      # --check-url makes re-runs idempotent: files already uploaded are
      # skipped instead of failing on PyPI's duplicate-filename rejection.
      - run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/
