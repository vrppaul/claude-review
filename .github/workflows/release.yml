name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Full CI suite (lint, tests, e2e, build) must pass on the tagged commit
  # before anything reaches PyPI — published versions are immutable.
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      id-token: write # PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v8

      - name: Check tag matches project version
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject.toml version $VERSION"
            exit 1
          fi

      # Before PyPI, so a version with no entry in CHANGELOG.md publishes nothing.
      # Kept out of the checkout, since the sdist takes every file git does not ignore.
      # GitHub draws every newline of a release's notes as a break, so the lines
      # the changelog wraps are joined back into whole items and paragraphs.
      - name: Take the release notes from the changelog
        run: |
          awk -v heading="## [${GITHUB_REF_NAME#v}]" \
            'index($0, heading) == 1 { found = 1; next } /^## \[/ { found = 0 } found' \
            CHANGELOG.md |
          awk '
            function flush() { if (held != "") print held; held = "" }
            /^$/ || /^#/ { flush(); print; next }
            /^- / { flush(); held = $0; next }
            { sub(/^ +/, ""); held = (held == "" ? $0 : held " " $0) }
            END { flush() }
          ' > "$RUNNER_TEMP/release-notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "CHANGELOG.md has no entry for $GITHUB_REF_NAME"
            exit 1
          fi

      - run: uv build

      - run: python3 scripts/verify_artifacts.py

      # --check-url makes re-runs idempotent: files already uploaded are
      # skipped instead of failing on PyPI's duplicate-filename rejection.
      - run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/

      # What's new in the review links here for everything else a release holds
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file "$RUNNER_TEMP/release-notes.md"
