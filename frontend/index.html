<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claude Review</title>
    <script>
      // Runs before first paint so the page never shows the wrong theme first.
      // The few lines duplicated from theme.svelte.ts are the point: a module
      // import is deferred, and the deferral is what causes the flash.
      (function () {
        var resolved = "dark";
        try {
          var stored = localStorage.getItem("claude-review:theme");
          if (stored === "light" || stored === "dark") {
            resolved = stored;
          } else if (window.matchMedia("(prefers-color-scheme: light)").matches) {
            resolved = "light";
          }
        } catch (e) {
          /* blocked site data — fall back to the default */
        }
        document.documentElement.setAttribute("data-theme", resolved);
      })();
    </script>
</head>
<body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
