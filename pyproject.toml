[project]
name = "claude-review"
version = "1.5.0"
description = "Browser-based code review tool for Claude Code"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "click>=8.3.2",
    "fastapi>=0.135.3",
    "pydantic>=2.12.5",
    "structlog>=25.5.0",
    "uvicorn>=0.43.0",
    "wsproto>=1.3.2",
]

[project.scripts]
claude-review = "claude_review.cli.main:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-playwright>=0.7.2",
    "ruff>=0.15.9",
    "ty>=0.0.28",
    "typos>=1.51.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py314"
line-length = 120
src = ["src"]
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.pyc",
    "build",
    "dist",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",        # pycodestyle errors
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "N",        # pep8-naming
    "SIM",      # flake8-simplify
    "TID",      # tidy imports
    "W",        # pycodestyle warnings
    "RUF",      # Ruff-specific rules
    "ASYNC",    # async anti-patterns
    "T20",      # no print() in source (use structlog)
    "RSE",      # unnecessary parens on raise
    "PERF",     # performance anti-patterns
    "FURB",     # refurb modernizations
    "PLC",      # pylint conventions (import-outside-toplevel among them)
    "PLE",      # pylint errors
    "PLW",      # pylint warnings
    "A",        # nothing shadows a builtin
    "ANN",      # every function says what it takes and gives
    "BLE",      # no blind `except Exception`
    "DTZ",      # no naive datetimes
    "EM",       # an exception's message is named before it is raised
    "ERA",      # no commented-out code
    "FLY",      # f-strings over joins of literals
    "G",        # logging calls take fields, not formatted strings
    "INP",      # no implicit namespace packages
    "ISC",      # no implicit string concatenation
    "LOG",      # logging used as meant
    "PGH",      # no blanket noqa or type: ignore
    "PIE",      # unnecessary pass, spreads and the like
    "PT",       # pytest used as meant
    "PTH",      # pathlib over os.path
    "RET",      # returns that say what they return
    "SLF",      # nothing reaches into another object's private members
    "TRY",      # exceptions raised and caught as meant
]
ignore = [
    "B008",     # function call in argument defaults (common in FastAPI)
    "SIM108",   # ternary operator — if/else often more readable
]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["claude_review"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any".msg = "Name the shape: a model, a protocol or a type of its own."
"typing.cast".msg = "Prove the type instead: narrow it, or validate it with a model."

[tool.ruff.lint.per-file-ignores]
# Standalone CI scripts run on bare python3 with no deps — print, not
# structlog — and are run by path, not imported from a package
"scripts/**" = ["T20", "INP001"]
# OpenAPI documents are JSON of any shape, and their writer says so
"src/claude_review/presentation/api_schema.py" = ["TID251"]

[tool.typos.default.extend-words]
# Not misspelt: pieces of words the tests type or read on purpose — a word
# typed one key at a time, the start of "café" read back in Latin-1, and
# keys pressed to show they land in a field
Ove = "Ove"
caf = "caf"
pn = "pn"

[tool.ty.environment]
python-version = "3.14"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.hatch.build.targets.wheel]
sources = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"src/claude_review/static/dist" = "claude_review/static/dist"

# Sdist ships prebuilt frontend assets (gitignored, hence force-include) and
# excludes frontend/ sources, so building a wheel from sdist needs no Node/pnpm.
[tool.hatch.build.targets.sdist]
exclude = ["/frontend"]

[tool.hatch.build.targets.sdist.force-include]
"src/claude_review/static/dist" = "src/claude_review/static/dist"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
