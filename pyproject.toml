[project]
name = "claude-review"
version = "1.7.0"
description = "Browser-based code review tool for Claude Code"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "click>=8.3.2",
    "fastapi>=0.135.3",
    "pydantic>=2.12.5",
    "starlette>=1.0.0",
    "structlog>=25.5.0",
    "uvicorn>=0.43.0",
    "wsproto>=1.3.2",
]

[project.scripts]
claude-review = "claude_review.cli.main:main"

[dependency-groups]
dev = [
    "anyio>=4.13.0",
    "deptry>=0.25.1",
    "httpx>=0.28.1",
    "hypothesis>=6.168.5",
    "import-linter>=2.15",
    "playwright>=1.58.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.9",
    "schemathesis>=4.30.1",
    "ty>=0.0.28",
    "typos>=1.51.1",
    "vulture>=2.16",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The API's schema fuzzed, the longest part of a run, is left out unless asked for: `-m schema` runs it
addopts = "-m 'not schema'"
markers = ["schema: fuzzes every route against the API's schema; run where a route or a schema changes"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py314"
line-length = 120
# Where the project's own modules are: the package, and the scripts, which import each other by path
src = ["src", "scripts"]
# What is excluded stays excluded when a hook names the file outright
force-exclude = true
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.pyc",
    "build",
    "dist",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
# No rule of the linter reads the tests (.claude/rules/tests.md)
exclude = ["tests/**"]
select = [
    "E",        # pycodestyle errors
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    # B027 among them refuses an empty member of an ABC that is not
    # @abstractmethod: every member of an interface is one a class must write
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "N",        # pep8-naming
    "SIM",      # flake8-simplify
    "TID",      # tidy imports
    "W",        # pycodestyle warnings
    "RUF",      # Ruff-specific rules
    "ASYNC",    # async anti-patterns
    "FAST",     # FastAPI as its docs write it: a dependency or a parameter's rules in Annotated
    "T20",      # no print() in source (use structlog)
    "RSE",      # unnecessary parens on raise
    "PERF",     # performance anti-patterns
    "FURB",     # refurb modernizations
    "PLC",      # pylint conventions (import-outside-toplevel among them)
    "PLE",      # pylint errors
    "PLW",      # pylint warnings
    "A",        # nothing shadows a builtin
    "ANN",      # every function says what it takes and gives
    "BLE",      # no blind `except Exception`
    "DTZ",      # no naive datetimes
    "EM",       # an exception's message is named before it is raised
    "ERA",      # no commented-out code
    "FLY",      # f-strings over joins of literals
    "G",        # logging calls take fields, not formatted strings
    "INP",      # no implicit namespace packages
    "ISC",      # no implicit string concatenation
    "LOG",      # logging used as meant
    "PGH",      # no blanket noqa or type: ignore
    "PIE",      # unnecessary pass, spreads and the like
    "PT",       # pytest used as meant
    "PTH",      # pathlib over os.path
    "RET",      # returns that say what they return
    "SLF",      # nothing reaches into another object's private members
    "TRY",      # exceptions raised and caught as meant
    "FBT",      # no bare True or False whose meaning only the signature knows
    "ARG",      # every parameter used: one an interface asks for and the method does not need is an override
    "C90",      # no function too tangled to follow
    "PLR0913",  # no function asking for more than five things
    "PLR2004",  # no number or string in a comparison without a name
]
ignore = [
    "SIM108",   # ternary operator — if/else often more readable
]

[tool.ruff.lint.pylint]
# A string compared outright is as unnamed as a number
allow-magic-value-types = []

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["claude_review"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any".msg = "Name the shape: a model, an interface or a type of its own."
"typing.Protocol".msg = "An interface its implementations inherit is an abstract class: abc.ABC, every member @abstractmethod."
"typing.cast".msg = "Prove the type instead: narrow it, or validate it with a model."

[tool.ruff.lint.per-file-ignores]
# Scripts are run by path, not imported from a package, and what they find
# is their output, printed as a linter prints its findings: nothing of theirs
# is a log. verify_artifacts.py runs on bare python3 with no deps, as CI runs
# it after the build; check_code_rules.py runs in the project's own
# environment, as the hook runs it
"scripts/**" = ["T20", "INP001"]
# A command takes one parameter per option, which click hands over by name
"src/claude_review/cli/agent_commands.py" = ["PLR0913"]
# The module is one match from each page event to its push. McCabe counts
# every case as a branch; ty proves the match covers the closed union of
# events (assert_never), so it is one dispatch. Grouping the events would
# not make it smaller: ty proves no match over a group's base class
# complete, so each group's own match would need its members listed again
"src/claude_review/presentation/event_pushes.py" = ["C901"]

[tool.importlinter]
root_package = "claude_review"
# The packages it imports are part of the graph, so a contract can forbid one
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The package's parts build on each other in one direction"
type = "layers"
containers = ["claude_review"]
# Each part may build on those below it, never on one above. The services
# and the repositories sit side by side: both build on the domain, and
# neither knows the other — the services reach the repository through its
# interface, which the domain holds.
layers = [
    "cli",
    "hosting",
    "presentation",
    "services | repositories",
    "domain",
]

[[tool.importlinter.contracts]]
name = "What a review is and does knows no web server and no command line"
type = "forbidden"
# The review is served over HTTP and started from a terminal, and neither is
# what it is: the domain, the services and the repositories build on no
# framework the presentation, the hosting or the command line are built on
source_modules = ["claude_review.domain", "claude_review.services", "claude_review.repositories"]
forbidden_modules = ["fastapi", "starlette", "uvicorn", "wsproto", "click"]

[[tool.importlinter.contracts]]
name = "An agent's command loads no web server and no web framework"
type = "forbidden"
# The agent's commands run many times a minute and call a review served in
# another process. Whatever they import, however indirectly — the API's
# schemas they share with the routers, the ports, the rendering — builds on neither
source_modules = ["claude_review.cli.agent_commands"]
forbidden_modules = ["fastapi", "starlette", "uvicorn", "wsproto"]

[[tool.importlinter.contracts]]
name = "An agent's command loads none of the review's work"
type = "forbidden"
# The review's state and its story are kept, checked and followed in the
# process that serves it; an agent's command only sends and prints. Through
# the story's schemas and the help of `story`, every command once loaded
# seven modules of that work, which it never ran
source_modules = ["claude_review.cli.agent_commands"]
forbidden_modules = [
    "claude_review.services.review",
    "claude_review.services.story_checks",
    "claude_review.services.story_telling",
    "claude_review.services.anchor_service",
]

[tool.vulture]
paths = ["src", "tests", "scripts"]
min_confidence = 60
# Called through what they are decorated as, never by name in this code:
# routes, validators, click commands, fixtures, and whatever an interface or a
# base class calls
ignore_decorators = [
    "@router.*",
    "@override",
    "@model_validator",
    "@field_validator",
    "@click.*",
    "@pytest.fixture",
    # A fixture of the browser tests, which runs in the browser's event loop
    "@in_the_browsers_loop",
]
ignore_names = [
    # Pydantic's own setting
    "model_config",
    # Read once written out — by the browser, or by comparing the whole —
    # never by name here
    "modified_ns",
    "sound_on_replies",
    "seen_release",
    "max_image_bytes",
    "max_images_per_message",
    "max_quoted_lines",
    "max_window_lines",
    "max_text_length",
    "max_feedback_length",
    "largest_file_shown_bytes",
    "ended",
    # A schema's parts, taken apart by TypeAdapter.json_schemas
    "direction",
    "adapter",
    # Matched by value against the type a transcript entry gives
    "USER",
    "ASSISTANT",
    # http.server calls do_<METHOD> by name
    "do_POST",
    # pytest calls a conftest's hook by name
    "pytest_itemcollected",
]

[tool.deptry.per_rule_ignores]
# Uvicorn speaks websockets through it, named in a setting rather than imported
DEP002 = ["wsproto"]

[tool.typos.files]
# The tests' spelling is not checked (.claude/rules/tests.md)
extend-exclude = ["tests/", "frontend/tests/"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
# No type check reads the tests (.claude/rules/tests.md)
exclude = ["tests"]

[tool.ty.terminal]
# A warning is a finding like any other: it fails the check, in a hook and in CI alike
error-on-warning = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.hatch.build.targets.wheel]
sources = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"src/claude_review/static/dist" = "claude_review/static/dist"

# Sdist ships prebuilt frontend assets (gitignored, hence force-include) and
# excludes frontend/ sources, so building a wheel from sdist needs no Node/pnpm.
[tool.hatch.build.targets.sdist]
exclude = ["/frontend"]

[tool.hatch.build.targets.sdist.force-include]
"src/claude_review/static/dist" = "src/claude_review/static/dist"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
