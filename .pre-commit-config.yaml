# Every hook runs once, before the commit; only the message check runs on the message
default_stages: [pre-commit]

repos:
  # Ruff — the project's own, the one `uv run` and CI use: a mirror pins a
  # release of its own and drifts from it
  - repo: local
    hooks:
      - id: ruff
        name: ruff (linter)
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff (formatter)
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]

      # The code rules no linter here can be told to keep: no function
      # inside another, no name too short to say what it holds, no model
      # taken apart by the names of its fields. The tests are held to
      # formatting alone, here as by every linter.
      - id: code-rules
        name: code rules (nested functions, short names, models by field names)
        entry: uv run python scripts/check_code_rules.py
        language: system
        types: [python]
        exclude: ^tests/

      - id: typos
        name: typos
        # What pyproject.toml excludes stays excluded when the hook names a file
        entry: uv run typos --force-exclude
        language: system
        types: [text]

  # Pre-commit hooks for general file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-toml
      - id: debug-statements
      - id: check-docstring-first
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-ast
      - id: check-builtin-literals

  # ty - Astral's Rust-based type checker
  - repo: local
    hooks:
      - id: ty
        name: ty (type checker)
        entry: uv run ty check src
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]
      - id: import-layers
        name: import-linter (the package's layers)
        entry: uv run lint-imports
        language: system
        files: ^(src/|pyproject\.toml$)
        pass_filenames: false
        stages: [pre-commit]
      - id: vulture
        name: vulture (code nothing calls)
        entry: uv run vulture
        language: system
        files: ^(src/|tests/|pyproject\.toml$)
        pass_filenames: false
        stages: [pre-commit]
      - id: deptry
        name: deptry (dependencies as declared)
        entry: uv run deptry src
        language: system
        files: ^(src/|pyproject\.toml$)
        pass_filenames: false
        stages: [pre-commit]

  # Bandit - Security linting for Python. 1.8 fails on every file of
  # Python 3.14's ast that holds a call with a keyword, skips the file and
  # passes: 1.9 reads them
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        name: bandit (security linter)
        args: [-c, pyproject.toml]
        additional_dependencies: ['bandit[toml]']
        exclude: ^(tests/|hatch_build\.py$)
      # The build hook starts pnpm, which is what it is for: bandit says so of
      # importing subprocess (B404) and of a process started from a list of
      # arguments (B603), and cannot tell a list written out in the code from
      # one a caller handed in. Skipped there alone; a shell, which can be
      # handed words to run, is still refused there (B602, B605)
      - id: bandit
        name: bandit (the build hook, which starts pnpm)
        args: [-c, pyproject.toml, --skip, 'B404,B603']
        additional_dependencies: ['bandit[toml]']
        files: ^hatch_build\.py$

  # Validate pyproject.toml
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.24.1
    hooks:
      - id: validate-pyproject
        name: validate pyproject.toml

  # Frontend — ESLint, svelte-check, Prettier
  # Uses local hooks because mirror repos don't support Svelte plugins.
  # Without pnpm they fail and say so; leave them out on purpose with SKIP.
  - repo: local
    hooks:
      - id: frontend-lint
        name: eslint and stylelint (frontend)
        entry: bash scripts/page_check.sh lint
        language: system
        files: ^frontend/(src/|eslint\.config\.js$|stylelint\.config\.js$)
        pass_filenames: false

      - id: frontend-check
        name: svelte-check (frontend)
        entry: bash scripts/page_check.sh check
        language: system
        files: ^frontend/(src/|tsconfig\.json$)
        pass_filenames: false

      # Files, exports and dependencies nothing uses
      - id: frontend-knip
        name: knip (frontend)
        entry: bash scripts/page_check.sh knip
        language: system
        files: ^frontend/(src/|tests/|package\.json$|knip\.ts$)
        pass_filenames: false

      # Checks rather than rewrites: a commit never carries formatting it was not shown
      - id: frontend-format
        name: prettier (frontend)
        entry: bash scripts/page_check.sh format:check
        language: system
        files: ^frontend/(src/|tests/|[^/]+\.config\.(js|ts)$|knip\.ts$|\.prettierrc\.json$)
        pass_filenames: false

  # The browser's types are generated from the server's schemas: a schema
  # changed without regenerating them fails here, not in a browser
  - repo: local
    hooks:
      - id: api-types
        name: generated API types match the server
        entry: bash scripts/page_check.sh api:check
        language: system
        files: ^(src/claude_review/(presentation|domain)/|frontend/src/lib/types/generated/)
        pass_filenames: false

  # The skill ships twice — as a skill, and as the plugin's command — and
  # the two copies must say the same thing
  - repo: local
    hooks:
      - id: skill-copies
        name: skill copies match
        entry: cmp skills/review-ui/SKILL.md plugin/commands/review-ui.md
        language: system
        files: ^(skills/review-ui/SKILL\.md|plugin/commands/review-ui\.md)$
        pass_filenames: false

  # The instruction files — AGENTS.md, and the rules of each area under
  # .claude/rules/ — are read into agents' sessions, so each is held to its
  # size. They are held to naming what is there too, which a commit breaks
  # by moving a file without touching them: so this runs on every commit
  - repo: local
    hooks:
      - id: instruction-files
        name: instruction files (their size, the paths they name, how they are reached)
        entry: uv run python scripts/check_instruction_files.py
        language: system
        always_run: true
        pass_filenames: false

  # Conventional commits enforcement
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        name: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat
          - fix
          - docs
          - style
          - refactor
          - perf
          - test
          - build
          - ci
          - chore
