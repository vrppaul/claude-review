# Every hook runs once, before the commit; only the message check runs on the message
default_stages: [pre-commit]

repos:
  # Ruff — the project's own, the one `uv run` and CI use: a mirror pins a
  # release of its own and drifts from it
  - repo: local
    hooks:
      - id: ruff
        name: ruff (linter)
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff (formatter)
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]

      # The code rules no linter here can be told to keep: no function
      # inside another, no name too short to say what it holds
      - id: code-rules
        name: code rules (nested functions, short names)
        entry: uv run python scripts/check_code_rules.py
        language: system
        types: [python]

      - id: typos
        name: typos
        entry: uv run typos
        language: system
        types: [text]

  # Pre-commit hooks for general file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-toml
      - id: debug-statements
      - id: check-docstring-first
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-ast
      - id: check-builtin-literals

  # ty - Astral's Rust-based type checker
  - repo: local
    hooks:
      - id: ty
        name: ty (type checker)
        entry: uv run ty check src tests
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]
      - id: import-layers
        name: import-linter (the package's layers)
        entry: uv run lint-imports
        language: system
        files: ^(src/|pyproject\.toml$)
        pass_filenames: false
        stages: [pre-commit]
      - id: vulture
        name: vulture (code nothing calls)
        entry: uv run vulture
        language: system
        files: ^(src/|tests/|pyproject\.toml$)
        pass_filenames: false
        stages: [pre-commit]
      - id: deptry
        name: deptry (dependencies as declared)
        entry: uv run deptry src
        language: system
        files: ^(src/|pyproject\.toml$)
        pass_filenames: false
        stages: [pre-commit]

  # Bandit - Security linting for Python
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        name: bandit (security linter)
        args: [-c, pyproject.toml]
        additional_dependencies: ['bandit[toml]']
        exclude: ^tests/

  # Validate pyproject.toml
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.24.1
    hooks:
      - id: validate-pyproject
        name: validate pyproject.toml

  # Frontend — ESLint, svelte-check, Prettier
  # Uses local hooks because mirror repos don't support Svelte plugins.
  # Skipped gracefully if pnpm is not installed.
  - repo: local
    hooks:
      - id: frontend-lint
        name: eslint (frontend)
        entry: bash -c 'command -v pnpm >/dev/null || exit 0; cd frontend && pnpm lint'
        language: system
        files: ^frontend/(src/|tests/|eslint\.config\.js$)
        pass_filenames: false

      - id: frontend-check
        name: svelte-check (frontend)
        entry: bash -c 'command -v pnpm >/dev/null || exit 0; cd frontend && pnpm check'
        language: system
        files: ^frontend/(src/|tests/|tsconfig\.json$)
        pass_filenames: false

      # Files, exports and dependencies nothing uses
      - id: frontend-knip
        name: knip (frontend)
        entry: bash -c 'command -v pnpm >/dev/null || exit 0; cd frontend && pnpm knip'
        language: system
        files: ^frontend/(src/|tests/|package\.json$|knip\.ts$)
        pass_filenames: false

      # Checks rather than rewrites: a commit never carries formatting it was not shown
      - id: frontend-format
        name: prettier (frontend)
        entry: bash -c 'command -v pnpm >/dev/null || exit 0; cd frontend && pnpm format:check'
        language: system
        files: ^frontend/(src/|tests/|[^/]+\.config\.(js|ts)$|knip\.ts$|\.prettierrc\.json$)
        pass_filenames: false

  # The browser's types are generated from the server's schemas: a schema
  # changed without regenerating them fails here, not in a browser
  - repo: local
    hooks:
      - id: api-types
        name: generated API types match the server
        entry: bash -c 'command -v pnpm >/dev/null || exit 0; cd frontend && pnpm api:check'
        language: system
        files: ^(src/claude_review/(presentation|domain)/|frontend/src/lib/types/generated/)
        pass_filenames: false

  # The skill ships twice — as a skill, and as the plugin's command — and
  # the two copies must say the same thing
  - repo: local
    hooks:
      - id: skill-copies
        name: skill copies match
        entry: cmp skills/review-ui/SKILL.md plugin/commands/review-ui.md
        language: system
        files: ^(skills/review-ui/SKILL\.md|plugin/commands/review-ui\.md)$
        pass_filenames: false

  # Conventional commits enforcement
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        name: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat
          - fix
          - docs
          - style
          - refactor
          - perf
          - test
          - build
          - ci
          - chore
